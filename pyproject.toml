[project]
name = "flins"
version = "0.9.0"
description = "FLINS: local-first personal voice + WhatsApp assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "websockets>=15",
    "tzdata>=2024.1",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # OpenAI-compatible LLM providers (Gemini, Groq, NVIDIA, ...)
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "mcp>=1.10",
    "cryptography>=43",
]

[project.optional-dependencies]
# M6 voice. Install with: uv sync --extra voice
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "pynput>=1.7",
]

[project.scripts]
flins = "flins.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flins"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Used on purpose: curly apostrophes from phones, and the brackets that neutralise < > in prompts.
allowed-confusables = ["‹", "›", "‘", "’"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["flins"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# Voice libraries ship without type information.
module = ["sounddevice", "pynput", "pynput.*", "pyttsx3", "faster_whisper", "ctranslate2", "numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["flins.core.*", "flins.settings", "flins.skills.*", "flins.skilldev.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
