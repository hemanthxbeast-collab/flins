# FLINS policy — example. Copy to policy.yaml and edit.
# Levels: IGNORE(0) < NOTIFY(1) < DRAFT(2) < AUTO_SAFE(3) < AUTO(4)
# Final level = min(mode ceiling, tier ceiling, contact max_level, category ceiling,
#                   triage/sensitivity ceiling, skill max_level, budget ceiling)

version: 1
dry_run: true                 # shadow mode: never actually send. Turn off at M4.
auto_replies: holding_only    # send holding-reply templates automatically in busy modes (or: off).
                              # unlocked = also AI replies, unreviewed, to contacts you opted in
                              # (flins contacts auto <name> on) once they've earned it:
auto_unlock:                  # stricter only: lower than 20 / higher than 10% is clamped
  min_approved: 20            # AI drafts you approved for that contact
  max_edit_rate: 0.10         # share of those you edited or rejected
self_chat_notes: true        # FLINS answers, approval prompts and urgent alerts in your self-chat

user:
  name: "Hemanth"
  signature: "— FLINS, Hemanth's assistant"
  timezone: "Asia/Kolkata"
  languages: ["en", "te", "hi"]

modes:
  NORMAL:
    ceiling: NOTIFY
    interrupt_threshold: 2        # urgency 0-3; ≥ this → spoken/toast alert
  WORKING:
    ceiling: AUTO
    default_duration: 3h
    interrupt_threshold: 3
    holding_template: working
    backlog: ignore_older
  FOCUS:
    ceiling: AUTO_SAFE
    default_duration: 90m
    interrupt_threshold: 3        # only emergencies break through
    holding_template: focus
  AWAY:
    ceiling: AUTO_SAFE
    default_duration: 2h
    interrupt_threshold: 3
    holding_template: away
  PAUSED:
    ceiling: IGNORE

profiles:                         # optional overlays, chosen by voice: "working mood, strict"
  working-strict:
    base: WORKING
    ceiling: AUTO_SAFE
  working-open:
    base: WORKING
    tiers: { known: AUTO_SAFE }

tiers:
  inner:   { ceiling: AUTO_SAFE, tone: warm_family,  disclose_ai: true }
  trusted: { ceiling: AUTO,      tone: casual,       disclose_ai: true }
  known:   { ceiling: DRAFT,     tone: casual,       disclose_ai: true }
  unknown: { ceiling: NOTIFY,    tone: professional, disclose_ai: true, holding_reply: false }
  blocked: { ceiling: IGNORE }

categories:
  greeting_smalltalk:   AUTO
  availability_query:   AUTO
  logistics_eta:        AUTO_SAFE
  scheduling:           DRAFT
  work_task:            DRAFT
  info_request_simple:  DRAFT
  urgent_emergency:     { ceiling: AUTO_SAFE, escalate: true, template: emergency_ack }
  money_payment:        NOTIFY
  credentials_otp:      NOTIFY
  personal_sensitive:   NOTIFY
  conflict_emotional:   NOTIFY
  media_only:           NOTIFY
  group_message:        IGNORE
  group_mention:        NOTIFY    # @mentioned in a group listed in hard_rules.groups.allowlist
  spam_promo:           IGNORE
  unknown:              DRAFT

sensitivity_caps:               # any flag set by hard rules or triage → cap
  money: NOTIFY
  credentials: NOTIFY
  pii: NOTIFY
  commitment: DRAFT
  legal_medical: NOTIFY
  injection_suspected: NOTIFY

hard_rules:
  # Add your own languages here (Telugu/Hindi in Latin script work well as plain words).
  emergency_keywords: ["emergency", "accident", "hospital", "urgent", "call me now", "asap call",
                       "please pick up", "jaldi call", "turant call", "pick up the phone"]
  money_patterns: ['₹\s?\d', '\brs\.?\s?\d', '\bupi\b', '\bgpay\b', '\bphonepe\b', '\bpaytm\b',
                   'send money', '\bloan\b', 'transfer', '\bpaise\b', '\bpaisa\b', 'bhej do paise']
  credential_patterns: ['\botp\b', 'verification code', '\bpassword\b', '\bpin\b', '\bcvv\b']
  # Health and legal words are built in (doctor, medicine, test results, police, court...).
  # Add your own, e.g. in Telugu/Hindi:
  sensitive_patterns: []
  groups:
    allowlist: []               # group JIDs where @mentions may NOTIFY
  loop_detection:
    fast_reply_seconds: 5
    fast_reply_count: 2
    identical_msg_count: 3

limits:
  per_contact_max_auto_per_hour: 2
  global_max_auto_per_hour: 20
  global_max_auto_per_day: 80
  debounce_quiet_seconds: 25
  debounce_max_seconds: 90
  send_delay_seconds: [20, 90]
  typing_chars_per_second: 8
  only_reply_if_contact_initiated: true
  allow_links_in_auto: false
  daily_llm_budget_usd: 2.00    # exceeded → budget ceiling = NOTIFY

drafting:
  min_confidence_auto: 0.75
  min_confidence_draft: 0.40
  max_thread_messages: 10
  redflag_check: true

approvals:
  expiry_minutes: 30
  on_expiry: holding_template    # or: none
  channels: [dashboard, voice, wa_selfchat]

templates:                        # {name}, {user}, {until}, {signature} available.
                                  # FLINS speaks *about* you: write them in the third person.
  working:   "Hey {name}! {user} is busy with work right now and will get back to you after {until}. {signature}"
  focus:     "Hey {name}! {user} is in deep-work mode until {until} and will reply after that. If it's urgent, just say 'urgent'. {signature}"
  away:      "Hey {name}! {user} is out right now, back around {until}. He'll reply then. {signature}"
  emergency_ack: "Saw this. Alerting {user} right now. {signature}"
retention:
  messages_days: 30
  audit_days: 180
