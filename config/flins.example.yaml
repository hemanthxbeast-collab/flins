# FLINS app config: example. Copy to flins.yaml to customise (flins.yaml is git-ignored).
# Secrets do NOT go here. Put them in .env.

paths:
  data_dir: data                 # relative to the project root
  db_file: flins.db              # inside data_dir

network:
  dashboard_port: 8765           # 127.0.0.1 only
  sidecar_port: 8766             # 127.0.0.1 only
  skilldev_port: 8767

logging:
  level: INFO                    # message text is never logged to files at INFO

# ---------------------------------------------------------------------------------------------
# AI providers. Keys go in .env (ANTHROPIC_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, NVIDIA_API_KEY,
# OPENAI_API_KEY, OPENROUTER_API_KEY). Ollama runs locally and needs no key.
#
# For each job, list providers in order of preference. FLINS skips any without a key, and moves
# to the next one if a call fails or returns broken JSON. If a model *declines* to answer, FLINS
# just tells you; it never shops the message around to other models.
# Every provider's answer goes through the same validation and output guard.
#
# Check what's available with your keys:   uv run flins llm models groq
# (Hosted models get retired; NVIDIA's free tier can be slow. `flins llm test` tells you.)
# Check that each entry works:             uv run flins llm test
# Compare providers on the safety eval:    uv run flins eval --live --provider groq
#
# price_in / price_out (USD per million tokens) let the daily budget count providers FLINS
# doesn't know prices for. Without them those calls count as $0.
llm:
  roles:
    triage:          # classifies each message: small and fast is fine
      - {provider: anthropic, model: claude-haiku-5-5}
      - {provider: groq, model: openai/gpt-oss-20b}
      - {provider: gemini, model: gemini-3.8-flash}
      - {provider: nvidia, model: nvidia/nemotron-3.5-lightning-30b-a3b}
    draft:           # writes replies: use your best model here
      - {provider: anthropic, model: claude-sonnet-5-5}
      - {provider: gemini, model: gemini-3.8-flash}
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: nvidia, model: nvidia/nemotron-3.5-lightning-30b-a3b}
    redflag:         # last check before an unreviewed send
      - {provider: anthropic, model: claude-haiku-5-5}
      - {provider: groq, model: openai/gpt-oss-20b}
      - {provider: gemini, model: gemini-3.8-flash}
      - {provider: nvidia, model: nvidia/nemotron-3.5-lightning-30b-a3b}

  # Optional: tweak a built-in provider or add any OpenAI-compatible one.
  # providers:
  #   ollama: {base_url: "http://localhost:11434/v1"}
  #   together: {base_url: "https://api.together.xyz/v1", key_env: TOGETHER_API_KEY}

# ---------------------------------------------------------------------------------------------
# Skills (M7). Each skill still needs `flins skills enable <name>`.
skills:
  enabled: true                 # false = never run any skill
  dir: skills
  calendar_ics: null            # e.g. C:/Users/you/calendar.ics (for availability_reply)
  faq_file: config/faq.yaml     # your answers (for faq_responder); see faq.example.yaml

# ---------------------------------------------------------------------------------------------
# Voice (M6). Install once: uv sync --extra voice. Then `flins run --voice`, or set enabled: true.
# Press the hotkey, speak, and FLINS answers out loud. The speech model downloads the first
# time (base ~140 MB, small ~460 MB).
voice:
  enabled: false
  hotkey: "<ctrl>+<alt>+<space>"
  accuracy: balanced      # fast (base, ~0.7 s) | balanced (small, careful, better with Indian
                          # English) | best (medium, slow, 1.5 GB). stt_model: <name> overrides.
  stt_device: cpu         # cuda = NVIDIA GPU (needs CUDA 12 + cuDNN installed)
  language: en            # en stops short clips being read as German; null = detect every time
  tts: sapi               # sapi = Windows voices, print = show text only
  tts_voice: null         # e.g. "Zira", "David", "Heera" (see: uv run flins voice voices)
  tts_rate: 185
  speak_alerts: true      # say urgent alerts, expiry warnings and the summary out loud
  wake_word: false        # true = say "FLINS" instead of the hotkey (mic always listening, locally)
  wake_model: tiny        # small speech model used only to spot the wake word

# ---------------------------------------------------------------------------------------------
# Backups (M9). Needs FLINS_BACKUP_PASSPHRASE in .env. `flins backup` any time.
backup:
  dir: null               # default data/backups; better a folder on another disk or OneDrive
  keep: 14
  daily: true             # flins run makes one a day
