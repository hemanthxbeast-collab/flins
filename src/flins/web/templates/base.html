<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block head %}{% endblock %}
<title>FLINS</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1b1b1a; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2457c5; --ok: #1f7a4d; --warn: #9a6200; --bad: #b3261e; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #a09f98; --line: #2f2e2b;
      --accent: #7ea6ff; --ok: #6fcf9a; --warn: #f0b350; --bad: #ff8a80; --chip: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 20px; align-items: center; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header b { font-size: 17px; letter-spacing: .02em; }
  header nav a { color: var(--text); text-decoration: none; margin-right: 14px; }
  header nav a:hover { color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .muted { color: var(--muted); }
  .flash { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
           padding: 10px 14px; margin-bottom: 16px; border-radius: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 14px; margin-bottom: 10px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px;
          font-size: 12.5px; margin-right: 4px; white-space: nowrap; }
  .lvl-auto, .lvl-auto_safe { color: var(--ok); font-weight: 600; }
  .lvl-draft { color: var(--accent); font-weight: 600; }
  .lvl-notify { color: var(--warn); font-weight: 600; }
  .lvl-ignore { color: var(--muted); }
  .urgent { color: var(--bad); font-weight: 700; }
  .draft { border-left: 3px solid var(--line); padding: 4px 10px; margin: 8px 0 2px; white-space: pre-wrap; }
  .draft.send { border-left-color: var(--ok); }
  button, select, input[type=text], input[type=search] {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  form.inline { display: inline; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; font-size: 13px; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--chip); padding: 10px; border-radius: 6px; }
  a { color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <b>FLINS</b>
  <nav><a href="/">Inbox</a><a href="/contacts">Contacts</a><a href="/skills">Skills{% if skills_waiting %} <span class="chip">{{ skills_waiting }} to review</span>{% endif %}</a></nav>
  <span class="muted">{{ mode if mode else "" }}</span>
</header>
<main>
  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
